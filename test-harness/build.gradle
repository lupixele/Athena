// Pure-JVM test harness for Athena touch/trackpad logic.
// No Android SDK required. Compiles ACTUAL production TouchContext,
// AbsoluteTouchContext, RelativeTouchContext, TrackpadContext classes.
//
plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

tasks.named('compileJava') {
    source = fileTree('src/main/java') + fileTree('../app/src/main/java') {
        include 'com/limelight/binding/input/touch/**'
        include 'com/limelight/LimeLog.java'
        include 'com/limelight/nvstream/input/MouseButtonPacket.java'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
