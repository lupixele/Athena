// Pure-JVM test harness for Athena touch/trackpad logic.
// No Android SDK required. Tests run on any JDK 17+ via Gradle.
//
// Usage (from this directory):
//   .\gradlew.bat test
//   .\gradlew.bat test --tests "com.limelight.test.*"
//
// This is a STANDALONE Gradle project — do NOT include it in the Android
// root settings.gradle. It has its own settings.gradle.
plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
